<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Fati! 🎂 - A Special Message Just for You</title>
    <meta name="description" content="A private, personal birthday card for you with love" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Global error handler
      window.addEventListener('error', function(event) {
        console.error('Global error:', event.error);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding: 2rem; color: white; text-align: center; font-family: Arial, sans-serif;">
              <h1>Something went wrong</h1>
              <p>Please try refreshing the page or contact support if the issue persists.</p>
              <p>Error: ${event.error?.message || 'Unknown error'}</p>
            </div>
          `;
        }
      });
    </script>
  </body>
</html>
